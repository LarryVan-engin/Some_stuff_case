{% extends 'myapp/base.html' %}

{% block content %}
  <h1>Light Status</h1>
  <ul>
    {% for l in lightstatuses %}
      <li>{{ l.device.device_id }} - On: {{ l.is_on }} - Brightness: {{ l.brightness }}</li>
    {% empty %}
      <li>No lights found.</li>
    {% endfor %}
  </ul>
{% endblock %}
</html>
