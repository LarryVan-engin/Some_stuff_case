{% extends "myapp/base.html" %}

{% block content %}

<div class="card">
    <h2>Room</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Devices Count</th>
            </tr>

        </thead>
        <tbody>
        
        {% for room in rooms %}
            <tr>
                <td>{{ room.name }}</td>
                <td>{{ room.description|default:"No description" }}</td>
                <td>{{ room.devices_set.count }}</td>
            </tr>
        {% endfor %}

        {% empty %}
            <tr>
                <td colspan="3">No rooms available.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
